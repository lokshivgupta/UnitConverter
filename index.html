<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <script src="script.js" defer></script>
     <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <h1>Unit Converter</h1>

    <!-- Tabs / category buttons -->
    <nav aria-label="Converter categories">
      <button type="button" id="tab-length" aria-current="page">Length</button>
      <button type="button" id="tab-weight">Weight</button>
      <button type="button" id="tab-temperature">Temperature</button>
    </nav>
    <form id="converter">
        <div>
            <label for="value">Enter the length to convert</label><br />
            <input type="number" id="value" name="value" placeholder="e.g., 12" step="any" />
          </div>
  
          <div>
            <label for="from-unit">Unit to Convert from</label><br />
            <input type="text" id="from-unit" name="from-unit" placeholder="e.g., cm" />
          </div>
  
          <div>
            <label for="to-unit">Unit to Convert to</label><br />
            <input type="text" id="to-unit" name="to-unit" placeholder="e.g., inches" />
          </div>
  
          <div>
            <button type="button" id="convert-btn">Convert</button>
          </div>

          <div>
            <p id="result">result will be here</p>
          </div>
    </form>
       

</body>
</html>
